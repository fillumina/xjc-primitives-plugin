# Runs the build and the test suite on every push and pull request, on JDK 21, which is the JDK
# this project targets.

name: CI

on:
  push:
  pull_request:

jobs:
  test:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build and test
      run: mvn -B verify --file pom.xml
